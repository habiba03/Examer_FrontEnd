<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
    <h4 class="text-primary fw-bold mb-0">
      <i class="fas fa-camera-retro me-2"></i>Exam Captures
    </h4>
    <span class="badge bg-dark px-3 py-2">Total: {{ images.length }} Images</span>
  </div>

  <div class="row overflow-auto" style="max-height: 80vh;">
    <div class="col-xl-3 col-lg-4 col-md-6 mb-4" *ngFor="let img of images; let i = index">
      <div class="card h-100 shadow-sm image-card" (click)="openGallery(i)">
        <div class="image-wrapper">
          <img [src]="'data:image/jpeg;base64,' + img" class="card-img-top" alt="Capture">
          <div class="overlay">
            <i class="fas fa-search-plus text-white fs-4"></i>
          </div>
        </div>
        <div class="card-footer bg-white border-0 text-center">
          <small class="text-muted fw-bold">Image #{{ i + 1 }}</small>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="images.length === 0" class="text-center my-5 py-5">
    <i class="fas fa-folder-open fa-3x text-light mb-3"></i>
    <p class="text-muted">No images found for this student.</p>
  </div>
</div>

<div class="custom-modal" *ngIf="selectedIndex !== null" (click)="closeGallery()">
  <span class="close-btn">&times;</span>
  
  <button class="nav-btn prev" (click)="$event.stopPropagation(); prevImage()">
    <i class="fas fa-chevron-left"></i>
  </button>

  <div class="modal-content-wrapper" (click)="$event.stopPropagation()">
    <img [src]="'data:image/jpeg;base64,' + images[selectedIndex]" class="modal-img">
    <div class="caption">Image {{ selectedIndex + 1 }} of {{ images.length }}</div>
  </div>

  <button class="nav-btn next" (click)="$event.stopPropagation(); nextImage()">
    <i class="fas fa-chevron-right"></i>
  </button>
</div>
